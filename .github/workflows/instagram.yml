# Daily Instagram run.
#
# 1. Queues any newly published article as a draft post and renders its slides
#    into public/ig/, so a new review becomes a ready-made carousel on its own.
# 2. Publishes the next *approved* carousel in social/instagram/queue.json.
# 3. Commits the queue and any new slides. The push redeploys the site, which
#    puts new slides online for tomorrow's run and refreshes /links.
#
# Nothing is posted until you change a post's status to "approved" — on
# GitHub's web editor that is a one-word edit you can make from your phone.
#
# Secrets (Settings → Secrets and variables → Actions):
#   IG_USER_ID, IG_ACCESS_TOKEN, and optionally IG_GRAPH_HOST.
name: Instagram

on:
  schedule:
    # 17:20 UTC = 18:20 in the UK in summer (17:20 in winter): early-evening scroll time.
    - cron: '20 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue and render new posts
        run: npx tsx scripts/instagram/build.ts --sync
      - name: Publish next approved post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST }}
        run: npx tsx scripts/instagram/publish.ts
      - name: Commit queue and slides
        run: |
          git config user.name "sharpandlean-bot"
          git config user.email "sharpandlean-bot@users.noreply.github.com"
          git add social/instagram public/ig
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Instagram: update queue and slides"
          git push
